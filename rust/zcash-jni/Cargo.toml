[package]
name = "zcash-jni"
version = "0.1.0"
edition = "2021"

[lib]
name = "zcash_sdk_kmp"
crate-type = ["cdylib"]

[dependencies]
rlz = { path = "../rlz", default-features = false }
anyhow = "1.0.97"
errno = "0.3"
jni = "0.22"
# No features of its own: Cargo unifies it with rlz's bundled SQLCipher, the one linked SQLite.
libsqlite3-sys = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
