[package]
name = "zcash-jni"
version = "0.1.0"
edition = "2021"

[lib]
name = "zcash_sdk_kmp"
crate-type = ["cdylib"]

[dependencies]
rlz = { path = "../rlz", default-features = false }
anyhow = "1.0.97"
jni = "0.22"
tokio = { version = "1", features = ["rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
