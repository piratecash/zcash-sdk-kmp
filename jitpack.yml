jdk:
  - openjdk21

before_install:
  - |
    # Maven Central answers JitPack's builders with 429 and Gradle fails hard on it, so every build here, buildSrc
    # included, tries Google's mirror of Central first.
    init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
    mkdir -p "$init_dir"
    cat > "$init_dir/central-mirror.gradle" <<'GRADLE'
    def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'

    def preferMirror = { RepositoryHandler repositories ->
        def repository = repositories.maven { name = 'GoogleCentralMirror'; url = mirror }
        repositories.remove(repository)
        repositories.addFirst(repository)
    }

    // Every build, buildSrc included, gets the mirror ahead of the repositories its settings declare.
    beforeSettings { settings ->
        preferMirror(settings.pluginManagement.repositories)
        preferMirror(settings.dependencyResolutionManagement.repositories)
    }

    // The mirror alone would hide the implicit plugin portal from a build that declares no plugin repositories.
    settingsEvaluated { settings ->
        def plugins = settings.pluginManagement.repositories
        if (plugins.size() == 1) plugins.gradlePluginPortal()
    }

    allprojects {
        preferMirror(buildscript.repositories)
        // Project repositories override the settings ones, so only a project that declares its own gets the mirror.
        afterEvaluate {
            if (!repositories.empty) preferMirror(repositories)
        }
    }
    GRADLE
  - |
    (
      echo "== wrapper diagnostics"; pwd; ls -la gradle/wrapper; sha256sum gradle/wrapper/gradle-wrapper.jar || true
      unzip -l gradle/wrapper/gradle-wrapper.jar 2>&1 | head -5 || true; file gradle/wrapper/gradle-wrapper.jar || true
      which java; java -version 2>&1; env | grep -iE '^(CLASSPATH|JAVA|GRADLE|SDKMAN)' || true
      git status --short | head -5; git ls-files gradle/wrapper; sh -x ./gradlew --version 2>&1 | tail -15 || true
      echo "== fs"; df -T . || true; mount | grep -E " / | /build| /home" || true; stat -f . || true
      unzip -l gradle/wrapper/gradle-wrapper.jar | tail -2; unzip -tq gradle/wrapper/gradle-wrapper.jar || true
      cp gradle/wrapper/gradle-wrapper.jar /tmp/w.jar && java -cp /tmp/w.jar org.gradle.wrapper.GradleWrapperMain --version 2>&1 | tail -3 || true
      java -cp "$PWD/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain --version 2>&1 | tail -3 || true
      java -Xshare:off -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --version 2>&1 | tail -3 || true
    )
  - |
    (
      set -eu
      fail() { echo "INVALID NATIVE SET: $*" >&2; exit 1; }
      case "${VERSION:-}" in
      v*)
        mkdir -p zcash-sdk/prebuilt/desktop zcash-sdk/prebuilt/android
        base="https://github.com/piratecash/zcash-sdk-kmp/releases/download/$VERSION"

        # A tag can become visible before CI publishes its release assets.
        fetch() {
          for attempt in $(seq 1 30); do
            curl -fsSL -o "$2" "$1" && return 0
            echo "waiting for $1 (attempt $attempt)"
            sleep 30
          done
          echo "asset never appeared: $1"
          return 1
        }

        mkdir -p /tmp/natives
        cd /tmp/natives
        for host in linux-x64 macos-arm64 windows-x64; do
          fetch "$base/native-$host.tar.gz" "native-$host.tar.gz"
        done
        fetch "$base/native-android.tar.gz" native-android.tar.gz
        fetch "$base/natives.sha256" natives.sha256

        printf '%s\n' \
          native-linux-x64.tar.gz native-macos-arm64.tar.gz \
          native-windows-x64.tar.gz native-android.tar.gz \
          | sort > expected-manifest-files
        awk 'NF == 2 { print $2 }' natives.sha256 | sed 's|^\./||' \
          | sort > actual-manifest-files
        diff -u expected-manifest-files actual-manifest-files \
          || fail "natives.sha256 does not name the exact archive set"

        if ! checksum_output=$(sha256sum --strict -c natives.sha256); then
          printf '%s\n' "$checksum_output"
          fail "archive checksum mismatch"
        fi
        printf '%s\n' "$checksum_output"
        cd - >/dev/null

        for host in linux-x64 macos-arm64 windows-x64; do
          tar -xzf "/tmp/natives/native-$host.tar.gz" -C zcash-sdk/prebuilt/desktop
        done
        tar -xzf /tmp/natives/native-android.tar.gz -C zcash-sdk/prebuilt/android

        expect() { [ -s "$1" ] || fail "missing or empty $1"; }
        expect zcash-sdk/prebuilt/desktop/native/x86_64-unknown-linux-gnu/libzcash_sdk_kmp.so
        expect zcash-sdk/prebuilt/desktop/native/aarch64-apple-darwin/libzcash_sdk_kmp.dylib
        expect zcash-sdk/prebuilt/desktop/native/x86_64-pc-windows-msvc/zcash_sdk_kmp.dll
        expect zcash-sdk/prebuilt/android/native/arm64-v8a/libzcash_sdk_kmp.so
        expect zcash-sdk/prebuilt/android/native/armeabi-v7a/libzcash_sdk_kmp.so
        find zcash-sdk/prebuilt -type f
        ;;
      *)
        echo "Not a tagged build (${VERSION:-unset}) - no prebuilt natives."
        ;;
      esac
    )
    before_install_status=$?
    [ "$before_install_status" -eq 0 ] || exit "$before_install_status"
    unset before_install_status
    echo "== wrapper after natives"; pwd; readlink -f .; ls -la gradle/wrapper; sha256sum gradle/wrapper/gradle-wrapper.jar || true

install:
  - |
    # The JitPack "latest" image fails to load the committed wrapper jar on tag builds
    # (ClassNotFoundException: GradleWrapperMain) while commit builds pass; fall back to a plain distribution.
    if ./gradlew --version; then
      ./gradlew :zcash-sdk:publishToMavenLocal --no-daemon
    else
      echo "wrapper unusable, using a plain Gradle distribution"
      curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.1.0-bin.zip && unzip -q /tmp/gradle.zip -d /tmp/gradle \
        && /tmp/gradle/gradle-9.1.0/bin/gradle :zcash-sdk:publishToMavenLocal --no-daemon
    fi
