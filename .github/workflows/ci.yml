name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04

    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  advisories:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories
        working-directory: rust
        run: cargo deny --manifest-path zcash-jni/Cargo.toml --locked check advisories

  rust:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning] tag builds restore no cache
        with:
          workspaces: rust
      # The Kotlin desktop suite only exercises the JNI surface; everything below it
      # (account derivation, the sync state machine, the SQL) is covered here.
      - name: Test rust workspace
        working-directory: rust
        run: cargo test --workspace

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: windows-2025
            artifact: windows-x64
          - os: macos-26
            artifact: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: temurin
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'gradle' || '' }} # zizmor: ignore[cache-poisoning] tag builds restore no cache
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning] tag builds restore no cache
        with:
          workspaces: rust
      # SQLCipher vendors OpenSSL, whose Configure needs Strawberry Perl. The bash
      # shell resolves `perl` to the MSYS build, which cannot run it.
      - name: Prefer Strawberry Perl
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls /c/Strawberry/perl/bin/perl.exe || choco install strawberryperl -y --no-progress
          echo 'C:\Strawberry\perl\bin' >> "$GITHUB_PATH"
          echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"

      # This image installs rustup through its package manager, so ~/.cargo/bin/cargo does not exist.
      - name: Point Gradle at the installed cargo
        if: runner.os == 'macOS'
        run: echo "CARGO=$(command -v cargo)" >> "$GITHUB_ENV"

      - name: Test desktop target
        shell: bash
        run: ./gradlew :zcash-sdk:desktopTest -PzcashSdk.rustRelease=true --console=plain
      - name: Upload native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.artifact }}
          path: zcash-sdk/build/rust/desktopResources/native
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: temurin
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'gradle' || '' }} # zizmor: ignore[cache-poisoning] tag builds restore no cache
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning] tag builds restore no cache
        with:
          workspaces: rust
      # A direct download keeps the pinned NDK independent of the runner's cmdline-tools.
      - name: Install NDK and cargo-ndk
        run: |
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      # This job produces the Android natives that JitPack consumes from the release.
      - name: Publish to Maven local
        run: ./gradlew :zcash-sdk:publishToMavenLocal -PzcashSdk.rustRelease=true --console=plain
      - name: Upload Android natives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-android
          path: zcash-sdk/build/rust/jniLibs
          if-no-files-found: error
      - name: Upload AAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aar
          path: zcash-sdk/build/outputs/aar
          if-no-files-found: error

  # The desktop jar must carry a native for every host, but JitPack publishes from a single
  # Linux builder. Attach each runner's binary to the tag so that build can fetch the rest.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, desktop, android]

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: natives
      - name: Pack each host's native
        run: |
          set -eu
          for dir in natives/native-*; do
            name=$(basename "$dir")
            mkdir -p "pack/$name/native"
            cp -R "$dir"/. "pack/$name/native/"
            tar -czf "$name.tar.gz" -C "pack/$name" native
          done
          ls -l ./*.tar.gz
      - name: Refuse to publish an incomplete set
        run: |
          set -eu
          fail() { echo "INCOMPLETE NATIVE SET: $*" >&2; exit 1; }

          verify() {
            [ -f "$1" ] || fail "$1 is missing"
            rm -rf "$RUNNER_TEMP/verify"
            mkdir -p "$RUNNER_TEMP/verify"
            tar -xzf "$1" -C "$RUNNER_TEMP/verify" \
              || fail "$1 is not a readable tarball"
            [ -s "$RUNNER_TEMP/verify/$2" ] || fail "$1 has no non-empty $2"
            case "$3" in
              elf)
                readelf -h "$RUNNER_TEMP/verify/$2" | grep -q "Machine:.*$4" \
                  || fail "$1: $2 is not built for $4"
                ;;
              file)
                file -b "$RUNNER_TEMP/verify/$2" | grep -Eq "$4" \
                  || fail "$1: $2 does not match $4"
                ;;
              *) fail "unknown inspector: $3" ;;
            esac
          }

          # Keep these in sync with zcashSdk.androidAbis in gradle.properties.
          verify native-linux-x64.tar.gz native/x86_64-unknown-linux-gnu/libzcash_sdk_kmp.so elf X86-64
          verify native-macos-arm64.tar.gz native/aarch64-apple-darwin/libzcash_sdk_kmp.dylib file '^Mach-O 64-bit.*arm64'
          verify native-windows-x64.tar.gz native/x86_64-pc-windows-msvc/zcash_sdk_kmp.dll file '^PE32\+.*x86-64.*MS Windows'
          verify native-android.tar.gz native/arm64-v8a/libzcash_sdk_kmp.so elf AArch64
          verify native-android.tar.gz native/armeabi-v7a/libzcash_sdk_kmp.so elf ARM

          sha256sum \
            native-linux-x64.tar.gz native-macos-arm64.tar.gz \
            native-windows-x64.tar.gz native-android.tar.gz > natives.sha256
          cat natives.sha256
      - name: Publish only a complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # Nothing is checked out here, so gh has no repository to infer from.
          REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" \
                 --notes "Native libraries for $TAG."
          gh release upload "$TAG" \
            native-linux-x64.tar.gz native-macos-arm64.tar.gz \
            native-windows-x64.tar.gz native-android.tar.gz natives.sha256 \
            --repo "$REPO" --clobber

          sha256sum \
            native-linux-x64.tar.gz native-macos-arm64.tar.gz \
            native-windows-x64.tar.gz native-android.tar.gz natives.sha256 \
            | sort > local-assets.sha256
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | select(.state == "uploaded")
                  | (.digest | sub("^sha256:";"")) + "  " + .name' \
            | sort > remote-assets.sha256
          diff -u local-assets.sha256 remote-assets.sha256 || {
            echo "release assets do not exactly match the validated set" >&2
            exit 1
          }
          gh release edit "$TAG" --repo "$REPO" --draft=false
      - name: Warm up JitPack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          url="https://jitpack.io/com/github/piratecash/zcash-sdk-kmp/$TAG/build.log"
          curl -s -o /dev/null --max-time 120 "$url" || true
          echo "Triggered $url"
