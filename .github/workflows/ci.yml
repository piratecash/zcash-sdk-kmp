name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The Kotlin desktop suite only exercises the JNI surface; everything below it
      # (account derivation, the sync state machine, the SQL) is covered here.
      - name: Test rust workspace
        working-directory: rust
        run: cargo test --workspace

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: windows-2025
            artifact: windows-x64
          - os: macos-26
            artifact: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # SQLCipher vendors OpenSSL, whose Configure needs Strawberry Perl. The bash
      # shell resolves `perl` to the MSYS build, which cannot run it.
      - name: Prefer Strawberry Perl
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls /c/Strawberry/perl/bin/perl.exe || choco install strawberryperl -y --no-progress
          echo 'C:\Strawberry\perl\bin' >> "$GITHUB_PATH"
          echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"

      - name: Test desktop target
        shell: bash
        run: ./gradlew :zcash-sdk:desktopTest --console=plain
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.artifact }}
          path: zcash-sdk/build/rust/desktopResources/native
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Same NDK bootstrap as jitpack.yml: a direct download works on any image,
      # with or without cmdline-tools.
      - name: Install NDK and cargo-ndk
        run: |
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      # Same command JitPack runs, so a green build here means the release is publishable.
      - name: Publish to Maven local
        run: ./gradlew :zcash-sdk:publishToMavenLocal --console=plain
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: aar
          path: zcash-sdk/build/outputs/aar
          if-no-files-found: error

  # The desktop jar must carry a native for every host, but JitPack publishes from a single
  # Linux builder. Attach each runner's binary to the tag so that build can fetch the rest.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, desktop, android]

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
      - name: Pack each host's native
        run: |
          set -eu
          for dir in natives/native-*; do
            name=$(basename "$dir")
            mkdir -p "pack/$name/native"
            cp -R "$dir"/. "pack/$name/native/"
            tar -czf "$name.tar.gz" -C "pack/$name" native
          done
          ls -l ./*.tar.gz
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # Nothing is checked out here, so gh has no repository to infer from.
          REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "$TAG" \
                 --notes "Desktop native libraries for $TAG."
          gh release upload "$TAG" ./*.tar.gz --repo "$REPO" --clobber
