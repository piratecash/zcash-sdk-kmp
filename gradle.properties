org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true

# Rust ABIs matching pcash app/build.gradle abiFilters.
# Override to shorten local builds, e.g. -PzcashSdk.androidAbis=arm64-v8a
zcashSdk.androidAbis=armeabi-v7a,arm64-v8a

# NDK that ECC ships its own Zcash Rust backend with — proven against this dependency stack.
zcashSdk.ndkVersion=27.0.12077973

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
